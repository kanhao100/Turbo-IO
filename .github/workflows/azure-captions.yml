name: Realtime captions V1
on:
  pull_request:
    paths:
      - 'rayneo-captions/**'
      - 'rayneo-protocol/**'
      - 'apps/RayNeoCompanion/**'
      - 'core-probe/**'
      - 'scripts/**'
      - '.github/workflows/azure-captions.yml'
  push:
    branches: ['feat/azure-captions-v1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: captions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --test scripts/check-source.test.mjs
      - run: node scripts/check-source.mjs
      - run: swift test --package-path rayneo-captions
      - run: swift test --package-path rayneo-protocol
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [local, device]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - run: node scripts/start.mjs --${{ matrix.mode }} --no-open
      - if: matrix.mode == 'local'
        run: node scripts/test-caption-boundaries.mjs
      - if: matrix.mode == 'device'
        run: >-
          xcodebuild -project apps/RayNeoCompanion/RayNeoCompanion.xcodeproj
          -scheme RayNeoCompanionDevice -destination 'generic/platform=iOS'
          -derivedDataPath apps/RayNeoCompanion/build-captions-device
          CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        if: matrix.mode == 'device'
        run: |
          APP="apps/RayNeoCompanion/build-captions-device/Build/Products/Debug-iphoneos/RayNeoCompanion.app"
          OUTPUT="apps/RayNeoCompanion/ipa"

          test -d "$APP"
          test -f "$APP/RayNeoCompanion"
          IPA_PLATFORM=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist")
          test "$IPA_PLATFORM" = "iPhoneOS"
          IPA_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          IPA_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          echo "Unsigned iPhoneOS IPA: version $IPA_VERSION, build $IPA_BUILD" >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT/Payload"
          cp -R "$APP" "$OUTPUT/Payload/"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$OUTPUT/Payload" "$OUTPUT/TurboIO-unsigned.ipa"
      - name: Upload unsigned IPA
        if: matrix.mode == 'device'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TurboIO-unsigned-ipa
          path: apps/RayNeoCompanion/ipa/TurboIO-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
