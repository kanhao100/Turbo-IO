name: iOS realtime subtitles

on:
  pull_request:
    paths:
      - 'apps/RayNeoCompanion/**'
      - 'core-probe/**'
      - 'rayneo-*/**'
      - 'scripts/**'
      - '.github/workflows/ios-rollback-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-subtitle-display-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check published sources
        run: |
          node --test scripts/check-source.test.mjs
          node scripts/check-source.mjs

      - name: Test glasses protocol
        run: swift test --package-path rayneo-protocol

      - name: Test ASR adapters and subtitle storage
        run: swift test --package-path rayneo-captions

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test subtitle display runtime and tab in simulator
        run: node scripts/test-subtitle-display.mjs

      - name: Export simulator screenshots
        if: always()
        continue-on-error: true
        run: >-
          xcrun xcresulttool export attachments
          --path apps/RayNeoCompanion/build-subtitle-simulator/Tests.xcresult
          --output-path apps/RayNeoCompanion/build-subtitle-simulator/screenshots

      - name: Upload simulator test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TurboIO-subtitle-display-tests
          path: apps/RayNeoCompanion/build-subtitle-simulator/screenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Generate device project
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          MODULE_DIR="core-probe/RecoveredInterface/build/RayneoNet.swiftmodule"
          mkdir -p "$MODULE_DIR"
          xcrun swiftc \
            -emit-module \
            -parse-as-library \
            -module-name RayneoNet \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            core-probe/RecoveredInterface/RayneoNet.swift \
            -emit-module-path "$MODULE_DIR/arm64-apple-ios.swiftmodule"
          xcodegen generate --spec apps/RayNeoCompanion/project-device.yml

      - name: Build unsigned iPhoneOS app
        run: >-
          xcodebuild -project apps/RayNeoCompanion/RayNeoCompanion.xcodeproj
          -scheme RayNeoCompanionDevice
          -destination 'generic/platform=iOS'
          -derivedDataPath apps/RayNeoCompanion/build-subtitle-device
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned IPA
        id: package
        run: |
          APP="apps/RayNeoCompanion/build-subtitle-device/Build/Products/Debug-iphoneos/RayNeoCompanion.app"
          OUTPUT="apps/RayNeoCompanion/ipa-realtime-subtitles"

          test -d "$APP"
          test -f "$APP/RayNeoCompanion"
          IPA_PLATFORM=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist")
          test "$IPA_PLATFORM" = "iPhoneOS"
          IPA_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          IPA_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          test "$IPA_VERSION" = "0.3.4"
          test "$IPA_BUILD" = "10"
          IPA_NAME="TurboIO-realtime-subtitles-v${IPA_VERSION}-build${IPA_BUILD}-unsigned.ipa"
          IPA_PATH="$OUTPUT/$IPA_NAME"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT/Payload"
          cp -R "$APP" "$OUTPUT/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$OUTPUT/Payload" "$IPA_PATH"
          shasum -a 256 "$IPA_PATH" | tee "$OUTPUT/SHA256SUMS.txt"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "artifact_name=TurboIO-realtime-subtitles-v${IPA_VERSION}-build${IPA_BUILD}-unsigned-ipa" >> "$GITHUB_OUTPUT"

          {
            echo "Unsigned iPhoneOS IPA"
            echo "Version: $IPA_VERSION ($IPA_BUILD)"
            echo "Filename: $IPA_NAME"
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            apps/RayNeoCompanion/ipa-realtime-subtitles/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
