name: iOS 26 unsigned IPA

on:
  pull_request:
    paths:
      - 'apps/RayNeoCompanion/**'
      - 'core-probe/**'
      - 'rayneo-*/**'
      - 'scripts/**'
      - '.github/workflows/ios-rollback-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios26-unsigned-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode 26 and iOS 26 SDK
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          case "$SDK_VERSION" in
            26.*) echo "iPhoneOS SDK: $SDK_VERSION" ;;
            *) echo "Expected iOS 26 SDK, found $SDK_VERSION" >&2; exit 1 ;;
          esac

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate device project
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          MODULE_DIR="core-probe/RecoveredInterface/build/RayneoNet.swiftmodule"
          mkdir -p "$MODULE_DIR"
          xcrun swiftc \
            -emit-module \
            -parse-as-library \
            -module-name RayneoNet \
            -target arm64-apple-ios26.0 \
            -sdk "$SDK_PATH" \
            core-probe/RecoveredInterface/RayneoNet.swift \
            -emit-module-path "$MODULE_DIR/arm64-apple-ios.swiftmodule"
          xcodegen generate --spec apps/RayNeoCompanion/project-device.yml

      - name: Build unsigned iPhoneOS app
        run: >-
          xcodebuild -project apps/RayNeoCompanion/RayNeoCompanion.xcodeproj
          -scheme RayNeoCompanionDevice
          -destination 'generic/platform=iOS'
          -derivedDataPath apps/RayNeoCompanion/build-ios26-device
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned IPA
        id: package
        run: |
          APP="apps/RayNeoCompanion/build-ios26-device/Build/Products/Debug-iphoneos/RayNeoCompanion.app"
          OUTPUT="apps/RayNeoCompanion/ipa-ios26"

          test -d "$APP"
          test -f "$APP/RayNeoCompanion"
          IPA_PLATFORM=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist")
          test "$IPA_PLATFORM" = "iPhoneOS"
          IPA_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          IPA_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          test "$IPA_VERSION" = "0.4.0"
          test "$IPA_BUILD" = "21"
          IPA_NAME="TurboIO-iOS26-v${IPA_VERSION}-build${IPA_BUILD}-unsigned.ipa"
          IPA_PATH="$OUTPUT/$IPA_NAME"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT/Payload"
          cp -R "$APP" "$OUTPUT/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$OUTPUT/Payload" "$IPA_PATH"
          (cd "$OUTPUT" && shasum -a 256 "$IPA_NAME") | tee "$OUTPUT/SHA256SUMS.txt"
          (cd "$OUTPUT" && shasum -a 256 -c SHA256SUMS.txt)
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "artifact_name=TurboIO-iOS26-v${IPA_VERSION}-build${IPA_BUILD}-unsigned-ipa" >> "$GITHUB_OUTPUT"

          {
            echo "Unsigned iPhoneOS IPA"
            echo "Version: $IPA_VERSION ($IPA_BUILD)"
            echo "Filename: $IPA_NAME"
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            apps/RayNeoCompanion/ipa-ios26/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
