name: iOS original rollback build

on:
  pull_request:
    paths:
      - 'apps/RayNeoCompanion/**'
      - 'core-probe/**'
      - 'rayneo-*/**'
      - 'scripts/**'
      - '.github/workflows/ios-rollback-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-original-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check published sources
        run: |
          node --test scripts/check-source.test.mjs
          node scripts/check-source.mjs

      - name: Test glasses protocol
        run: swift test --package-path rayneo-protocol

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate device project
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          MODULE_DIR="core-probe/RecoveredInterface/build/RayneoNet.swiftmodule"
          mkdir -p "$MODULE_DIR"
          xcrun swiftc \
            -emit-module \
            -parse-as-library \
            -module-name RayneoNet \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            core-probe/RecoveredInterface/RayneoNet.swift \
            -emit-module-path "$MODULE_DIR/arm64-apple-ios.swiftmodule"
          xcodegen generate --spec apps/RayNeoCompanion/project-device.yml

      - name: Build unsigned iPhoneOS app
        run: >-
          xcodebuild -project apps/RayNeoCompanion/RayNeoCompanion.xcodeproj
          -scheme RayNeoCompanionDevice
          -destination 'generic/platform=iOS'
          -derivedDataPath apps/RayNeoCompanion/build-original-device
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned IPA
        run: |
          APP="apps/RayNeoCompanion/build-original-device/Build/Products/Debug-iphoneos/RayNeoCompanion.app"
          OUTPUT="apps/RayNeoCompanion/ipa-original"

          test -d "$APP"
          test -f "$APP/RayNeoCompanion"
          IPA_PLATFORM=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist")
          test "$IPA_PLATFORM" = "iPhoneOS"
          IPA_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          IPA_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT/Payload"
          cp -R "$APP" "$OUTPUT/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$OUTPUT/Payload" "$OUTPUT/TurboIO-original-unsigned.ipa"
          shasum -a 256 "$OUTPUT/TurboIO-original-unsigned.ipa" | tee "$OUTPUT/SHA256SUMS.txt"

          {
            echo "Unsigned iPhoneOS IPA"
            echo "Version: $IPA_VERSION ($IPA_BUILD)"
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TurboIO-original-unsigned-ipa
          path: |
            apps/RayNeoCompanion/ipa-original/TurboIO-original-unsigned.ipa
            apps/RayNeoCompanion/ipa-original/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
